        // دالة فحص الوقت
        function isOpen(v) {
            const now = new Date();
            const h = now.getHours(); // الساعة الحالية
            
            // اذا كان وقت الاغلاق أصغر من وقت الفتح، يعني الدوام ليلي
            if (v.close < v.open) {
                return h >= v.open || h < v.close;
            } else {
                // دوام نهاري عادي
                return h >= v.open && h < v.close;
            }
        }

        function searchProducts() {

            document.getElementById('vendorsGrid').style.display = 'none';

            document.getElementById('productsGrid').style.display = 'grid';

        function calculateFinalTotal() {
            const foodTotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const areaIndex = document.getElementById('deliveryArea').value;
            if(areaIndex !== "") localStorage.setItem('userRegionIdx', areaIndex);
            const uniqueVendors = new Set(cart.map(item => item.vendorId));
            const vendorCount = uniqueVendors.size;
            let deliveryPrice = 0;
            let extraStopPrice = 0;
            document.getElementById('subTotalDisplay').innerText = foodTotal.toLocaleString() + " د.ع";
            if (areaIndex !== "") {
                deliveryPrice = deliveryRegions[areaIndex].price;
                if (vendorCount > 1) {
                    extraStopPrice = (vendorCount - 1) * EXTRA_STOP_FEE;
                    document.getElementById('extraStopRow').style.display = 'flex';
                    document.querySelector('#extraStopRow span:last-child').innerText = extraStopPrice.toLocaleString() + " د.ع";
                } else { document.getElementById('extraStopRow').style.display = 'none'; }
                document.getElementById('deliveryFeeDisplay').innerText = deliveryPrice.toLocaleString() + " د.ع";
                document.getElementById('grandTotalDisplay').innerText = (foodTotal + deliveryPrice + extraStopPrice).toLocaleString() + " د.ع";
            } else {
                document.getElementById('deliveryFeeDisplay').innerText = "--";
                document.getElementById('extraStopRow').style.display = 'none';
                document.getElementById('grandTotalDisplay').innerText = foodTotal.toLocaleString() + " د.ع";
            }
        }

        order_id: "#" + simpleID, // للشيت نخليه مع هاشتاك
        customer_name: "زبون آشور كات",
        customer_phone: customerPhone,
        customer_area: region.name,
        order_details: cart.map(i => `${i.qty}x ${i.name} (${i.vendorName}) {${i.price * i.qty}}`).join(' | '), 
        total_price: grandTotal.toLocaleString() + " د.ع",
        notes: deliveryNote
    };

    // الإرسال
    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(orderData)
    }).then(() => {
        
        // 👇 هنا الترتيب القوي للواتساب
        // شلنا الهاشتاك من الرسالة وخلينا أقواس واضحة
        let msg = `*🚀 طلب جديد من آشور كات*\n`;
        msg += `📄 *رقم الوصل:* ( ${simpleID} )\n`; 
        msg += `📍 *المنطقة:* ${region.name}\n`;
        msg += `📞 *هاتف الزبون:* ${customerPhone}\n`;
        if(deliveryNote) msg += `📝 *ملاحظة:* ${deliveryNote}\n`;
        msg += `---------------------------\n`;
        
        cart.forEach(item => {
            msg += `▪️ ${item.qty}x ${item.name} [${item.vendorName}]\n`;
        });
        
        msg += `---------------------------\n`;
        msg += `💰 *المبلغ الكلي (واصل):* ${grandTotal.toLocaleString()} د.ع\n`;
        
        // تنظيف
        cart = [];
        updateCartUI();
        closeInvoice();
        btn.innerHTML = originalText;
        btn.disabled = false;
        
        // تحويل
        const targetPhone = driversPhone[region.driver_key] || driversPhone['default'];
        const whatsappURL = `https://wa.me/${targetPhone}?text=${encodeURIComponent(msg)}`;
        window.location.href = whatsappURL;

    }).catch(e => {
        alert("حدث خطأ، حاول مرة أخرى.");
        btn.innerHTML = originalText;
        btn.disabled = false;
    });
}
        
        window.onclick = (e) => { 
            if(e.target.className === 'modal-overlay') {
                e.target.style.display = 'none';
            }
        }
